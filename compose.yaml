services:
  api-test:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /tmp/test.db
      MODE: TEST
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
    depends_on:
     - redis-test
  redis-test:
    image: redis:latest
    ports: 
      - "6379:6379"