services:
  api-test:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        python -m shared.database.db &&
        python -m product_catalog_context.infrastructure.outbox.event_dispatcher --database-url /tmp/test.db &
        python -m product_catalog_context.infrastructure.outbox.command_dispatcher --database-url /tmp/test.db &
        fastapi dev main.py --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /tmp/test.db
      MODE: TEST
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
    depends_on:
     - redis-test
  redis-test:
    image: redis:latest
    ports: 
      - "6379:6379"